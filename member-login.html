<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Login | SAHRUDAYA</title>
  <link rel="icon" type="image/jpeg" href="/SWAN_LOGO.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f5f7f2; --panel: #ffffff; --border: rgba(24,112,100,.18); --text: #183b3a; --muted: #58716f; --accent: #187064; --accent-hover: #c85b3e; --success: #187064; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1rem; background: radial-gradient(circle at top left, rgba(242,193,78,.22), transparent 30%), linear-gradient(180deg, #fbfcf7 0%, var(--bg) 100%); color: var(--text); font-family: 'Poppins', sans-serif; }
    .login-card { width: min(100%, 440px); padding: 1.75rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 18px 48px rgba(24,59,58,.12); }
    h1 { margin: 0 0 .35rem; font-size: 1.55rem; }
    .intro { margin: 0 0 1.25rem; color: var(--muted); }
    label { display: block; margin-top: .8rem; color: var(--muted); font-size: .9rem; }
    input { width: 100%; margin-top: .35rem; padding: .7rem .8rem; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { width: 100%; margin-top: 1.1rem; padding: .75rem 1rem; border: 0; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; font: inherit; font-weight: 600; }
    button:hover { background: var(--accent-hover); }
    .status { min-height: 1.35rem; margin: .7rem 0 0; color: #b54343; font-size: .88rem; }
    .status.success { color: var(--success); }
    .links { display: flex; justify-content: space-between; gap: 1rem; margin-top: .85rem; font-size: .86rem; }
    .links a, .register-prompt a { color: var(--accent); text-decoration: none; }
    .register-prompt { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem .4rem; margin-top: .85rem; padding: .7rem; border: 1px solid var(--border); border-radius: 6px; font-size: .88rem; }
    .register-prompt span { color: var(--muted); }
    .resend-verification { margin-top: .5rem; background: transparent; border: 1px solid var(--border); color: var(--accent); }
    .resend-verification:hover { color: #fff; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Member login</h1>
    <p class="intro">Access your SAHRUDAYA member account.</p>
    <form id="member-login-form">
      <label>Email <input type="email" name="email" autocomplete="email" required /></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required /></label>
      <button type="submit">Sign in</button>
      <p id="status" class="status" role="alert"></p>
      <button type="button" id="resend-verification" class="resend-verification" style="display: none;">Resend verification email</button>
    </form>
    <div class="register-prompt">
      <span>New to SAHRUDAYA?</span>
      <a href="/member-register.html">Register as a new member</a>
    </div>
    <div class="links">
      <a href="/">Back to site</a>
      <a href="/forgot-password.html">Forgot password?</a>
    </div>
  </main>
  <script>
    document.getElementById('member-login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const status = document.getElementById('status');
      status.textContent = '';
      status.classList.remove('success');
      try {
        const response = await fetch('/api/members/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.get('email'), password: form.get('password') })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to sign in');
        status.textContent = 'Login successful. Redirecting...';
        status.classList.add('success');
        window.location.href = '/member-dashboard.html';
      } catch (error) {
        status.textContent = error.message;
        document.getElementById('resend-verification').style.display = error.message.includes('verify your email') ? 'block' : 'none';
      }
    });

    document.getElementById('resend-verification').addEventListener('click', async () => {
      const email = document.querySelector('input[name="email"]').value.trim();
      const status = document.getElementById('status');
      if (!email) {
        status.textContent = 'Enter your registered email first.';
        return;
      }

      try {
        const response = await fetch('/api/members/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to resend verification email');
        status.textContent = result.message;
        document.getElementById('resend-verification').style.display = 'none';
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
