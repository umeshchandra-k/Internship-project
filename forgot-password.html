<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | SAHRUDAYA</title>
  <link rel="icon" type="image/jpeg" href="/SWAN_LOGO.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0d1117; --panel: #151d29; --border: rgba(255,255,255,.12); --text: #f4f7fb; --muted: #a0aec0; --accent: #3b82f6; --success: #22c55e; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at top, #182b48, var(--bg) 55%); color: var(--text); font-family: 'Poppins', sans-serif; }
    .card { width: min(100%, 460px); padding: 2.3rem; background: rgba(21,29,41,.92); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    h1 { margin: 0 0 .5rem; font-size: 2rem; }
    .intro { margin: 0 0 1.5rem; color: var(--muted); }
    label { display: block; margin-top: 1rem; color: var(--muted); font-size: .9rem; }
    input { width: 100%; margin-top: .45rem; padding: .85rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: #0d1117; color: var(--text); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { width: 100%; margin-top: 1.5rem; padding: .9rem 1rem; border: 0; border-radius: 8px; background: var(--accent); color: white; cursor: pointer; font: inherit; font-weight: 600; }
    button:hover { background: #2563eb; }
    .status { min-height: 1.5rem; margin-top: 1rem; color: #fca5a5; font-size: .9rem; }
    .status.success { color: var(--success); }
    .links { margin-top: 1rem; display: flex; justify-content: space-between; font-size: .9rem; }
    .links a { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Forgot password</h1>
    <p class="intro">Enter your email address and we’ll send a reset link.</p>
    <form id="forgot-password-form">
      <label>Email <input type="email" name="email" autocomplete="email" required /></label>
      <button type="submit">Send reset link</button>
      <p id="status" class="status" role="alert"></p>
    </form>
    <div class="links">
      <a href="/member-login.html">Back to login</a>
      <a href="/member-register.html">Create account</a>
    </div>
  </main>
  <script>
    const form = document.getElementById('forgot-password-form');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = { email: new FormData(form).get('email') };
      status.textContent = '';
      status.classList.remove('success');

      try {
        const response = await fetch('/api/members/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to send reset link');
        status.textContent = result.message || 'Reset link sent.';
        status.classList.add('success');
        form.reset();
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
