<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | SAHRUDAYA</title>
  <link rel="icon" type="image/jpeg" href="/SWAN_LOGO.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0d1117; --panel: #151d29; --border: rgba(255,255,255,.12); --text: #f4f7fb; --muted: #a0aec0; --accent: #3b82f6; --success: #22c55e; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: radial-gradient(circle at top, #182b48, var(--bg) 55%); color: var(--text); font-family: 'Poppins', sans-serif; }
    .card { width: min(100%, 460px); padding: 2.3rem; background: rgba(21,29,41,.92); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    h1 { margin: 0 0 .5rem; font-size: 2rem; }
    .intro { margin: 0 0 1.5rem; color: var(--muted); }
    label { display: block; margin-top: 1rem; color: var(--muted); font-size: .9rem; }
    input { width: 100%; margin-top: .45rem; padding: .85rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: #0d1117; color: var(--text); font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { width: 100%; margin-top: 1.5rem; padding: .9rem 1rem; border: 0; border-radius: 8px; background: var(--accent); color: white; cursor: pointer; font: inherit; font-weight: 600; }
    button:hover { background: #2563eb; }
    .status { min-height: 1.5rem; margin-top: 1rem; color: #fca5a5; font-size: .9rem; }
    .status.error { color: #fca5a5; }
    .status.success { color: var(--success); }
    .links { margin-top: 1rem; display: flex; justify-content: space-between; font-size: .9rem; }
    .links a { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset password</h1>
    <p class="intro">Choose a new password for your account.</p>
    <form id="reset-password-form">
      <label>New password <input type="password" name="password" minlength="6" required /></label>
      <label>Confirm password <input type="password" name="confirmPassword" minlength="6" required /></label>
      <button type="submit">Reset password</button>
      <p id="status" class="status" role="alert"></p>
    </form>
    <div class="links">
      <a href="/member-login.html">Back to login</a>
      <a href="/member-register.html">Create account</a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('reset-password-form');
    const status = document.getElementById('status');
    const submitButton = form.querySelector('button[type="submit"]');

    if (!token) {
      status.textContent = 'This password reset link is missing a valid token.';
      status.classList.add('error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!token) return;

      const formData = new FormData(form);
      const password = String(formData.get('password') || '').trim();
      const confirmPassword = String(formData.get('confirmPassword') || '').trim();

      status.textContent = '';
      status.classList.remove('success', 'error');

      if (!password || password.length < 6) {
        status.textContent = 'Password must be at least 6 characters long.';
        status.classList.add('error');
        return;
      }

      if (password !== confirmPassword) {
        status.textContent = 'Passwords do not match.';
        status.classList.add('error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Resetting...';

      try {
        const response = await fetch('/api/members/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to reset password');
        status.textContent = result.message || 'Password reset successfully.';
        status.classList.add('success');
        form.reset();

        setTimeout(() => {
          window.location.href = '/member-login.html';
        }, 1200);
      } catch (error) {
        status.textContent = error.message;
        status.classList.add('error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
